# Dependency updates land as PRs into develop; grouped so a routine week is one PR.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    open-pull-requests-limit: 5
    labels: [dependencies]
    ignore:
      # @types/node tracks the engines floor (Node 22): a newer major would
      # type APIs that Node 22 users do not have. Move it with the floor.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: "/"
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
    labels: [dependencies, ci]
