# Automated npm release.
#
# On every push to main, compares the version in package.json with the
# version published on npm. When package.json is strictly ahead (semver),
# it publishes to npm (running the full prepublishOnly quality gate), then
# tags the commit and creates a GitHub Release. Pushes that do not bump
# the version are a no-op, and a version that is equal to or behind the
# registry is never published, so a revert on main cannot repoint npm's
# "latest" tag at an old release.
#
# After tagging it also starts docker.yml for the new tag (a tag pushed with
# GITHUB_TOKEN cannot trigger workflows on its own) and lists the version on
# the MCP Registry via GitHub OIDC (no stored token). The Registry step also
# runs on any later push to main while npm has the version but the Registry
# does not, so a failed Registry publish recovers on the next push.
#
# Recovery: if a previous run published to npm but failed before tagging,
# the next run detects the missing tag and creates the tag and Release
# without republishing.
#
# Authentication is npm "trusted publishing" (OIDC): no NPM_TOKEN secret is
# stored in this repo. One-time setup on npmjs.com, after the package's
# first manual publish:
#   package page -> Settings -> Trusted Publisher -> GitHub Actions
#   repository: mswdev/better-unraid-mcp, workflow: release.yml
#
# Bootstrap: while the package has never been published, this workflow
# skips with a notice instead of failing. Publish the first version by
# hand (npm login && npm publish), configure the trusted publisher, and
# every later version bump merged to main releases itself.
name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write # create the version tag and GitHub Release
  id-token: write # npm trusted publishing and MCP Registry login (OIDC)
  actions: write # start docker.yml for the new tag

# One release run at a time; a second push waits for the first to finish
# so both cannot pass the version check before either publishes.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      # Pinned deliberately; the Sigstore check below is tied to this tag.
      MCP_PUBLISHER_VERSION: v1.8.9
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          registry-url: "https://registry.npmjs.org"
      # OIDC publishing needs npm >= 11.5.1; the runner's bundled npm is older.
      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@11
      - name: Decide whether this push is a release
        id: decide
        run: |
          PACKAGE_NAME="$(node -p "require('./package.json').name")"
          LOCAL_VERSION="$(node -p "require('./package.json').version")"
          echo "version=$LOCAL_VERSION" >> "$GITHUB_OUTPUT"

          set +e
          PUBLISHED_VERSION="$(npm view "$PACKAGE_NAME" version 2>npm-view-error.log)"
          VIEW_STATUS=$?
          set -e
          if [ "$VIEW_STATUS" -ne 0 ]; then
            if grep -q "E404" npm-view-error.log; then
              PUBLISHED_VERSION="unpublished"
            else
              echo "::error::npm view failed for a reason other than 'package not found'; refusing to guess."
              cat npm-view-error.log
              exit 1
            fi
          fi

          # Exits 0 only when the first version is strictly ahead of the second.
          is_ahead() {
            node -e '
              const parse = (version) => version.split(".").map(Number);
              const [local, published] = [parse(process.argv[1]), parse(process.argv[2])];
              for (let i = 0; i < 3; i++) {
                if (local[i] !== published[i]) process.exit(local[i] > published[i] ? 0 : 1);
              }
              process.exit(1);
            ' "$1" "$2"
          }

          tag_exists() {
            [ -n "$(git ls-remote --tags origin "refs/tags/v$1")" ]
          }

          if [ "$PUBLISHED_VERSION" = "unpublished" ]; then
            echo "::notice::Package has never been published. First publish is manual (see workflow header); skipping."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "tag=false" >> "$GITHUB_OUTPUT"
          elif is_ahead "$LOCAL_VERSION" "$PUBLISHED_VERSION"; then
            echo "Releasing $LOCAL_VERSION (npm has $PUBLISHED_VERSION)."
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "tag=true" >> "$GITHUB_OUTPUT"
          elif [ "$LOCAL_VERSION" = "$PUBLISHED_VERSION" ] && ! tag_exists "$LOCAL_VERSION"; then
            echo "::notice::Version $LOCAL_VERSION is on npm but untagged; recovering the tag and Release."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "tag=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Nothing to release: local $LOCAL_VERSION is not ahead of npm's $PUBLISHED_VERSION."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "tag=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Decide whether the MCP Registry needs this version
        id: registry
        env:
          VERSION: ${{ steps.decide.outputs.version }}
          PUBLISH: ${{ steps.decide.outputs.publish }}
        run: |
          if [ "$PUBLISH" = "true" ]; then
            echo "needed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          PACKAGE_NAME="$(node -p "require('./package.json').name")"
          SERVER_NAME="$(node -p "encodeURIComponent(require('./server.json').name)")"
          LOOKUP_URL="https://registry.modelcontextprotocol.io/v0.1/servers/$SERVER_NAME/versions/$VERSION"
          LOOKUP_STATUS="$(curl --silent --output /dev/null --write-out '%{http_code}' "$LOOKUP_URL")"
          ON_NPM="$(npm view "$PACKAGE_NAME@$VERSION" version 2>/dev/null || true)"
          if [ "$LOOKUP_STATUS" = "404" ] && [ "$ON_NPM" = "$VERSION" ]; then
            echo "::notice::$VERSION is on npm but not on the MCP Registry; publishing it there."
            echo "needed=true" >> "$GITHUB_OUTPUT"
          else
            echo "needed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Install dependencies
        if: steps.decide.outputs.publish == 'true'
        run: npm ci
      # npm publish runs the prepublishOnly gate (typecheck, build, test, lint)
      # and attaches provenance automatically under trusted publishing.
      - name: Publish to npm
        if: steps.decide.outputs.publish == 'true'
        run: npm publish
      - name: Tag and create GitHub Release
        if: steps.decide.outputs.tag == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ steps.decide.outputs.version }}"
          if [ -z "$(git ls-remote --tags origin "refs/tags/$TAG")" ]; then
            git tag "$TAG"
            git push origin "$TAG"
          fi
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "$TAG" --generate-notes
          fi
      # Attach the Claude Desktop one-click bundle (.mcpb) to the Release.
      - name: Build and upload the MCPB bundle
        if: steps.decide.outputs.tag == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          npm ci
          npm run build
          npm run build:mcpb
          gh release upload "v${{ steps.decide.outputs.version }}" build/*.mcpb --clobber
      - name: Start the Docker image build for the new tag
        if: steps.decide.outputs.tag == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run docker.yml --ref main -f tag="v${{ steps.decide.outputs.version }}"
      - name: Install cosign
        if: steps.registry.outputs.needed == 'true'
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Download and verify mcp-publisher
        if: steps.registry.outputs.needed == 'true'
        run: |
          set -euo pipefail
          archive="mcp-publisher_linux_amd64.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
          rm -f "$archive" "$archive.sigstore.json"
      # Last on purpose: a Registry hiccup must not block the npm release,
      # tag, or bundle. The Registry checks the npm package's mcpName, and npm
      # can take several minutes to serve a new version, so wait for it first.
      - name: Publish to the MCP Registry
        if: steps.registry.outputs.needed == 'true'
        env:
          VERSION: ${{ steps.decide.outputs.version }}
        run: |
          NPM_WAIT_ATTEMPTS=40
          NPM_WAIT_SECONDS=15
          MAX_ATTEMPTS=5
          RETRY_DELAY_SECONDS=30
          PACKAGE_NAME="$(node -p "require('./package.json').name")"
          for attempt in $(seq 1 "$NPM_WAIT_ATTEMPTS"); do
            if curl --fail --silent --output /dev/null "https://registry.npmjs.org/$PACKAGE_NAME/$VERSION"; then
              break
            fi
            echo "npm is not serving $PACKAGE_NAME@$VERSION yet (check $attempt of $NPM_WAIT_ATTEMPTS)."
            sleep "$NPM_WAIT_SECONDS"
          done
          ./mcp-publisher login github-oidc
          for attempt in $(seq 1 "$MAX_ATTEMPTS"); do
            if ./mcp-publisher publish; then
              exit 0
            fi
            echo "Registry publish attempt $attempt of $MAX_ATTEMPTS failed; retrying in ${RETRY_DELAY_SECONDS}s."
            sleep "$RETRY_DELAY_SECONDS"
          done
          echo "::error::MCP Registry publish failed after $MAX_ATTEMPTS attempts."
          exit 1
