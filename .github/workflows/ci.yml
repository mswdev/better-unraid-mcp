name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  build-test-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - name: Verify generated types are up to date
        run: |
          npm run generate
          if [ -n "$(git status --porcelain src/types/unraid/)" ]; then
            echo "::error::Generated types are stale or untracked. Run 'npm run generate' and commit the result."
            git status --porcelain src/types/unraid/
            exit 1
          fi
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test:coverage
      - run: npm run lint
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-summary
          path: coverage/coverage-summary.json

  # Publishes main's coverage summary to the `badges` branch, where the README
  # badge reads `total.lines.pct` through a shields.io dynamic JSON badge.
  coverage-badge:
    needs: build-test-lint
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write # push to the badges branch
    steps:
      - uses: actions/checkout@v7
        with:
          ref: badges
      - uses: actions/download-artifact@v8
        with:
          name: coverage-summary
      - name: Commit the summary if it changed
        run: |
          # Keep only the totals so per-file churn doesn't create badge commits.
          jq '{total: .total}' coverage-summary.json > totals.json
          mv totals.json coverage-summary.json
          git add coverage-summary.json
          if git diff --cached --quiet; then
            echo "Coverage unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(badges): coverage for ${GITHUB_SHA::7}"
          git push origin HEAD:badges
