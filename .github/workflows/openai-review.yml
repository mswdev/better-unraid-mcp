name: OpenAI Codex PR Review

# Automated PR review using OpenAI Codex.
# Uses the official openai/codex-action@v1 for agent-powered code reviews.
# The codex agent reads files, runs git commands, and understands codebase context.
#
# Security model: codex job has read-only permissions, posting happens in a
# separate job with write permissions (following OpenAI's recommended pattern).
#
# Review criteria are defined in .github/prompts/review.md, which references
# .claude/rules/ as the single source of truth for coding standards.
#
# Triggers:
# 1. PR opened/reopened/ready_for_review (not on every push)
# 2. 'codex-review' label added to a PR (manual trigger)
# 3. workflow_dispatch (manual fallback)

on:
  pull_request:
    types: [opened, ready_for_review, reopened, labeled]
  workflow_dispatch:

# Only one Codex review per PR at a time — cancel stale reviews
concurrency:
  group: codex-review-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  codex-review:
    if: |
      github.event_name == 'workflow_dispatch' || (
        github.event.pull_request.draft == false && (
          github.event.action != 'labeled' ||
          github.event.label.name == 'codex-review'
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      final_message: ${{ steps.run_codex.outputs.final-message }}
      skip: ${{ steps.changes.outputs.skip }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || '' }}
          fetch-depth: 0

      - name: Pre-fetch base ref for diff context
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags origin "$BASE_REF"
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}

      - name: Check changed files
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          FILES=$(git diff --name-only "origin/$BASE_REF...HEAD")
          CODE_FILES=$(echo "$FILES" | grep -vE '\.(md|txt)$|^docs/|^\.github/|^\.vscode/|^\.idea/|^LICENSE([-.]|$)|^\.gitignore$|^\.gitattributes$' || true)
          if [ -z "$CODE_FILES" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Only docs/config/workflow files changed — skipping Codex review"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build review prompt
        if: steps.changes.outputs.skip != 'true'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number || 'N/A (manual dispatch)' }}
          PR_REPO: ${{ github.repository }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha || 'HEAD~5' }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || 'HEAD' }}
          PR_TITLE: ${{ github.event.pull_request.title || 'Manual review (workflow_dispatch)' }}
          PR_BODY: ${{ github.event.pull_request.body || 'No PR context — this is a manual dispatch. Review recent changes on the default branch.' }}
        run: |
          {
            printf '%s\n\n' "This is PR #${PR_NUMBER} for ${PR_REPO}."
            printf '%s\n\n' "Review ONLY the changes introduced by this PR. Use git to examine the changes:"
            printf '%s\n' "  git log --oneline ${PR_BASE_SHA}...${PR_HEAD_SHA}"
            printf '%s\n\n' "  git diff ${PR_BASE_SHA}...${PR_HEAD_SHA}"
            printf '%s\n\n' "You can also read any file in the repository to understand context around the changes."
            printf '%s\n' "Pull request title: ${PR_TITLE}"
            printf '%s\n' "Pull request description:"
            printf '%s\n\n' "$PR_BODY"
            printf '%s\n' "---"
            printf '\n'
            cat .github/prompts/review.md
          } > .codex-review-prompt.md

      - name: Run Codex Review
        if: steps.changes.outputs.skip != 'true'
        id: run_codex
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          model: gpt-5.2-codex
          effort: high
          sandbox: read-only
          prompt-file: .codex-review-prompt.md

  post-review:
    runs-on: ubuntu-latest
    needs: codex-review
    if: |
      needs.codex-review.outputs.final_message != '' &&
      needs.codex-review.outputs.skip != 'true'
    permissions:
      pull-requests: write
      issues: write
    steps:
      - name: Post review comment
        uses: actions/github-script@v8
        env:
          CODEX_FINAL_MESSAGE: ${{ needs.codex-review.outputs.final_message }}
        with:
          github-token: ${{ github.token }}
          script: |
            const raw = process.env.CODEX_FINAL_MESSAGE || '';

            // For workflow_dispatch, there's no PR to post to — log output only
            if (!context.payload.pull_request) {
              core.info('No pull request context (workflow_dispatch). Review output:');
              core.info(raw);
              return;
            }

            const body = `## OpenAI Codex Review\n\n${raw}\n\n---\n**Model:** gpt-5.2-codex | **Effort:** high | **Sandbox:** read-only`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body,
            });
