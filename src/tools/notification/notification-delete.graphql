mutation DeleteNotification($id: PrefixedID!, $type: NotificationType!) {
  deleteNotification(id: $id, type: $type) {
    unread {
      info
      warning
      alert
      total
    }
    archive {
      info
      warning
      alert
      total
    }
  }
}
mutation DeleteArchivedNotifications {
  deleteArchivedNotifications {
    unread {
      info
      warning
      alert
      total
    }
    archive {
      info
      warning
      alert
      total
    }
  }
}
