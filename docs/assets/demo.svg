<text x="18" y="136" fill="#9ca3af" opacity="0"><tspan fill="#38bdf8">  </tspan>  ⚠ capacity: array is 96% full · ⚠ docker: 2 updates<animate attributeName="opacity" from="0" to="1" dur="0.25s" begin="1.40s" fill="freeze"/></text>
