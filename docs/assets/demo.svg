<text x="18" y="202" fill="#e5e7eb" opacity="0"><tspan fill="#38bdf8">  </tspan>Your array is not degraded — it is nearly full. disk27 (22 TB) has<animate attributeName="opacity" from="0" to="1" dur="0.25s" begin="2.45s" fill="freeze"/></text>
<text x="18" y="224" fill="#e5e7eb" opacity="0"><tspan fill="#38bdf8">  </tspan>0.7 TB left and the cache_downloads pool is at 95%. Move or prune<animate attributeName="opacity" from="0" to="1" dur="0.25s" begin="2.80s" fill="freeze"/></text>
<text x="18" y="246" fill="#e5e7eb" opacity="0"><tspan fill="#38bdf8">  </tspan>large downloads, or add a disk (array_disk_action needs a stopped<animate attributeName="opacity" from="0" to="1" dur="0.25s" begin="3.15s" fill="freeze"/></text>
<text x="18" y="268" fill="#e5e7eb" opacity="0"><tspan fill="#38bdf8">  </tspan>array — I will not do that without your confirm + acknowledge_risk).<animate attributeName="opacity" from="0" to="1" dur="0.25s" begin="3.50s" fill="freeze"/></text>
<text x="18" y="312" fill="#e5e7eb" opacity="0"><tspan fill="#38bdf8">> </tspan>restart the plex container<animate attributeName="opacity" from="0" to="1" dur="0.25s" begin="4.20s" fill="freeze"/></text>
<text x="18" y="334" fill="#f87171" opacity="0"><tspan fill="#38bdf8">  </tspan>docker_container_action → refused: needs confirm: true<animate attributeName="opacity" from="0" to="1" dur="0.25s" begin="4.55s" fill="freeze"/></text>
<text x="18" y="356" fill="#34d399" opacity="0"><tspan fill="#38bdf8">  </tspan>…confirmed by you → Restarted container /plex (verified).<animate attributeName="opacity" from="0" to="1" dur="0.25s" begin="4.90s" fill="freeze"/></text>
