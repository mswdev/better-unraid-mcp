<text x="18" y="92" fill="#fbbf24" opacity="0"><tspan fill="#38bdf8">  </tspan>system_health → OVERALL: WARNING<animate attributeName="opacity" from="0" to="1" dur="0.25s" begin="0.70s" fill="freeze"/></text>
