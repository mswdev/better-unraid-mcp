<svg xmlns="http://www.w3.org/2000/svg" width="760" height="380" viewBox="0 0 760 380" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">
<rect width="760" height="380" rx="10" fill="#0f172a"/>
